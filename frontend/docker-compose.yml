version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: noblenestsco-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noblenestsco
    ports:
      - "5432:5432"
    volumes:
      - noblenestsco-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noblenestsco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  noblenestsco-pgdata:
